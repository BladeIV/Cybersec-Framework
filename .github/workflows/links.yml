name: Link check

on:
  schedule:
    - cron: "0 7 * * 1"   # weekly, Monday 07:00 UTC
  pull_request:
    paths:
      - "netguardian/catalog/**"
      - "scripts/check_links.py"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Check catalog links
        run: python scripts/check_links.py
