[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netguardian"
version = "0.1.0"
description = "Open-source triage framework and tool catalog for blue and red teams, built on a TUI."
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
authors = [{ name = "NetGuardian contributors" }]
keywords = ["security", "tui", "nist-csf", "blue-team", "red-team", "triage", "osint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "textual>=0.80",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = ["textual-serve>=1.1"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/BladeIV/Cybersec-Framework"
Issues = "https://github.com/BladeIV/Cybersec-Framework/issues"

[project.scripts]
netguardian = "netguardian.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["netguardian"]
# Catalog YAML lives inside the package, so it ships as package data automatically.
