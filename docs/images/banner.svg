<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#16263d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#1b3350" stroke-width="1" opacity="0.4">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
  </g>

  <!-- shield emblem -->
  <g transform="translate(90,70)">
    <path d="M80 0 L150 26 V86 C150 132 120 158 80 172 C40 158 10 132 10 86 V26 Z"
          fill="url(#shield)" stroke="url(#accent)" stroke-width="3"/>
    <!-- checkmark / node motif -->
    <path d="M48 86 L72 112 L116 56" fill="none" stroke="url(#accent)" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="86" r="7" fill="#38bdf8"/>
    <circle cx="116" cy="56" r="7" fill="#2dd4bf"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="118" font-size="72" font-weight="700" fill="#f1f5f9">Net<tspan fill="url(#accent)">Guardian</tspan></text>
  <text x="302" y="162" font-size="25" fill="#94a3b8">Open-source triage framework &amp; security tool catalog for the terminal.</text>

  <!-- CSF function chips -->
  <g font-size="19" font-weight="600" text-anchor="middle">
    <g transform="translate(302,210)">
      <rect width="118" height="40" rx="20" fill="#13263d" stroke="#2b4a6f"/>
      <text x="59" y="26" fill="#7dd3fc">Govern</text>
    </g>
    <g transform="translate(432,210)">
      <rect width="118" height="40" rx="20" fill="#13263d" stroke="#2b4a6f"/>
      <text x="59" y="26" fill="#7dd3fc">Identify</text>
    </g>
    <g transform="translate(562,210)">
      <rect width="118" height="40" rx="20" fill="#13263d" stroke="#2b4a6f"/>
      <text x="59" y="26" fill="#7dd3fc">Protect</text>
    </g>
    <g transform="translate(692,210)">
      <rect width="118" height="40" rx="20" fill="#13263d" stroke="#2b4a6f"/>
      <text x="59" y="26" fill="#7dd3fc">Detect</text>
    </g>
    <g transform="translate(822,210)">
      <rect width="118" height="40" rx="20" fill="#13263d" stroke="#2b4a6f"/>
      <text x="59" y="26" fill="#7dd3fc">Respond</text>
    </g>
    <g transform="translate(952,210)">
      <rect width="118" height="40" rx="20" fill="#13263d" stroke="#2b4a6f"/>
      <text x="59" y="26" fill="#7dd3fc">Recover</text>
    </g>
  </g>

  <text x="1110" y="48" text-anchor="end" font-size="18" fill="#475569">NIST CSF 2.0 · red + blue</text>
</svg>
